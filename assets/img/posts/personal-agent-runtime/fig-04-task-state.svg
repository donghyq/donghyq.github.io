<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="477" version="1.1" viewBox="0 0 920 477" width="920"><title>后台任务调度与恢复</title><desc>持久调度器唤醒任务，Worker 提交状态，并在等待事件时释放资源</desc><defs/><rect fill="#ffffff" height="477" width="920" x="0" y="0"/><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" x="30" y="35">后台任务状态机</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="30" y="63">SCHEDULED → READY → RUNNING；审批后重新入队</text><rect fill="#f8fafb" height="86" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="156" x="22" y="127"/><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="38" y="155">SCHEDULED</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="38" y="180">等待时间触发</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="178" x2="199" y1="170" y2="170"/><polyline fill="none" points="193,165 199,170 193,175" stroke="#a7bac1" stroke-width="2"/><rect fill="#f8fafb" height="86" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="156" x="202" y="127"/><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="218" y="155">READY</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="218" y="180">放入就绪队列</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="358" x2="379" y1="170" y2="170"/><polyline fill="none" points="373,165 379,170 373,175" stroke="#a7bac1" stroke-width="2"/><rect fill="#f8fafb" height="86" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="156" x="382" y="127"/><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="398" y="155">RUNNING</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="398" y="180">Worker 持有租约</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="538" x2="559" y1="170" y2="170"/><polyline fill="none" points="553,165 559,170 553,175" stroke="#a7bac1" stroke-width="2"/><rect fill="#f8fafb" height="86" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="156" x="562" y="127"/><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="578" y="155">WAITING_INPUT</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="578" y="180">释放执行资源</text><rect fill="#e8f4f0" height="86" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="156" x="742" y="127"/><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="758" y="155">COMPLETED</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="758" y="180">结果提交</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" x="428" y="271">用户输入 / 审批完成 → 重新入队</text><rect fill="#f5f7f8" height="110" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="805" x="55" y="312"/><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="74" y="340">持久数据</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" x="74" y="367">task_id / run_id / generation / state_ref / next_wakeup / lease_owner / lease_until</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" x="74" y="390">Event Log：任务创建、Timer、Tool Result、Approval、Run 状态变化</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="460" y="451">等待由 Timer / 事件触发，Worker 可释放并由其他实例接手</text><path d="M460 126 L460 96 L820 96 L820 126" stroke="#4b98a2" stroke-width="2" fill="none"/><polyline points="814,120 820,126 826,120" stroke="#4b98a2" stroke-width="2" fill="none"/><text x="678" y="90" fill="#2c4f61" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">正常完成</text><path d="M640 214 L640 284 L280 284 L280 214" stroke="#a7bac1" stroke-width="2" fill="none"/><polyline points="274,220 280,214 286,220" stroke="#a7bac1" stroke-width="2" fill="none"/></svg>