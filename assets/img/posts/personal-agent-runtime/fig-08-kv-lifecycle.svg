<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="505" version="1.1" viewBox="0 0 920 505" width="920" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>长期任务执行与 KV Cache 生命周期</title><desc>模型调用与工具等待在时间上交替，GPU KV 不必始终保持驻留</desc><defs /><rect fill="#ffffff" height="505" width="920" x="0" y="0" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" x="30" y="35">Task / Runtime / Inference 生命周期</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="30" y="63">应用层的持久执行与推理层缓存复用具有不同的时间尺度</text><rect fill="#e8f4f0" height="66" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="158" x="45" y="120" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" x="61" y="148">LLM 生成</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="204" x2="232" y1="154" y2="154" /><polyline fill="none" points="226,149 232,154 226,159" stroke="#a7bac1" stroke-width="2" /><rect fill="#eff5f8" height="66" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="158" x="240" y="120" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" x="256" y="148">Tool I/O</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="399" x2="427" y1="154" y2="154" /><polyline fill="none" points="421,149 427,154 421,159" stroke="#a7bac1" stroke-width="2" /><rect fill="#eff5f8" height="66" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="158" x="425" y="120" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" x="441" y="148">等待用户</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="584" x2="612" y1="154" y2="154" /><polyline fill="none" points="606,149 612,154 606,159" stroke="#a7bac1" stroke-width="2" /><rect fill="#e8f4f0" height="66" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="158" x="611" y="120" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" x="627" y="148">Resume LLM</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" x="35" y="257">任务记录</text><rect fill="#eff5f8" height="40" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="713" x="145" y="236" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="500" y="261">持久（Task / Artifact / Permission State）</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" x="35" y="334">执行进程</text><rect fill="#e8f4f0" height="44" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="170" x="146" y="309" /><rect fill="#f5f7f8" height="44" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="138" x="355" y="309" /><rect fill="#e8f4f0" height="44" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="146" x="713" y="309" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="230" y="337">运行</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="422" y="337">工具</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="786" y="337">重新启动</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" x="35" y="404">HBM / KV</text><rect fill="#e8f4f0" height="49" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="174" x="145" y="378" /><rect fill="#fff6e7" height="49" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="391" x="320" y="378" /><rect fill="#e8f4f0" height="49" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="145" x="713" y="378" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="232" y="406">Prefill / KV</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="515" y="406">保留 / 下沉 / 淘汰 / 重算</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="786" y="406">Restore / Prefill</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="460" y="476">KV 是否复用取决于实际前缀、格式、授权域与恢复成本</text></svg>