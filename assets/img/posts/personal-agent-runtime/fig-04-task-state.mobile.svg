<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="845px" version="1.1" viewBox="0 0 420 845" width="420px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="845" width="420" x="0" y="0" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" x="22" y="36">持久任务状态流</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" x="22" y="61">Task / Run / Wakeup</text><rect fill="#f4f7f8" height="114" rx="12" ry="12" stroke="#c8d6da" stroke-width="1.2" width="384" x="18" y="85" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="34" y="118">SCHEDULED</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" x="34" y="150">定时器 / 事件待触发</text><text fill="#167a77" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" x="210" y="220">↓</text><rect fill="#eaf4f0" height="114" rx="12" ry="12" stroke="#c8d6da" stroke-width="1.2" width="384" x="18" y="226" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="34" y="259">READY</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" x="34" y="291">进入就绪队列</text><text fill="#167a77" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" x="210" y="361">↓</text><rect fill="#f4f7f8" height="114" rx="12" ry="12" stroke="#c8d6da" stroke-width="1.2" width="384" x="18" y="367" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="34" y="400">RUNNING</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" x="34" y="432">Worker 获得租约与 generation</text><text fill="#167a77" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" x="210" y="502">↓</text><rect fill="#eaf4f0" height="114" rx="12" ry="12" stroke="#c8d6da" stroke-width="1.2" width="384" x="18" y="508" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="34" y="541">WAITING_INPUT</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" x="34" y="573">保存进度并释放执行资源</text><text fill="#167a77" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" x="210" y="643">↓</text><rect fill="#f4f7f8" height="114" rx="12" ry="12" stroke="#c8d6da" stroke-width="1.2" width="384" x="18" y="649" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="34" y="682">RESUME</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" x="34" y="714">WAITING_INPUT → READY → RUNNING</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" x="34" y="736">任务结束后提交 COMPLETED</text><text fill="#596c75" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="400" x="22" y="814">等待输入后先重新排队，再由 Worker 取得执行权</text></svg>