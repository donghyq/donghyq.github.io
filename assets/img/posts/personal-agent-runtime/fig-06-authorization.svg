<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="486" version="1.1" viewBox="0 0 920 486" width="920" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Muse 与 Dots 的操作控制位置</title><desc>两者公开信息粒度不同，左侧为 Linux 实现机制，右侧为产品权限与审查能力</desc><defs /><rect fill="#ffffff" height="486" width="920" x="0" y="0" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" x="30" y="35">External Actions · 权限控制</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="30" y="63">Muse 有细粒度运行时披露；Dots 公布规则、操作审查与应用权限</text><rect fill="#eff5f8" height="352" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="423" x="25" y="95" /><rect fill="#e8f4f0" height="352" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="420" x="475" y="95" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" x="44" y="124">Muse</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" x="494" y="124">Dots</text><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="384" x="44" y="149" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="60" y="177">Hatch / runtime cell</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="60" y="202">模型请求外部操作</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="236" x2="236" y1="208" y2="219" /><polyline fill="none" points="231,213 236,219 241,213" stroke="#a7bac1" stroke-width="2" /><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="384" x="44" y="220" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="60" y="248">privsep + authd</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="60" y="273">受限连接器 / 凭据替身</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="236" x2="236" y1="279" y2="290" /><polyline fill="none" points="231,284 236,290 241,284" stroke="#a7bac1" stroke-width="2" /><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="384" x="44" y="291" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="60" y="319">Sentinel / egress</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="60" y="344">动作授权与出口检查</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="236" x2="236" y1="350" y2="361" /><polyline fill="none" points="231,355 236,361 241,355" stroke="#a7bac1" stroke-width="2" /><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="384" x="44" y="362" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="60" y="390">外部服务 / Browser</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="60" y="415">执行授权后的请求</text><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="379" x="494" y="149" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="510" y="177">Dot / Plugins / Browser</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="510" y="202">模型选择受支持动作</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="686" x2="686" y1="208" y2="219" /><polyline fill="none" points="681,213 686,219 691,213" stroke="#a7bac1" stroke-width="2" /><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="379" x="494" y="220" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="510" y="248">App Permissions</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="510" y="273">限定应用可用动作范围</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="686" x2="686" y1="279" y2="290" /><polyline fill="none" points="681,284 686,290 691,284" stroke="#a7bac1" stroke-width="2" /><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="379" x="494" y="291" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="510" y="319">Custom Rules + Auto-review</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="510" y="344">审批或安全检查</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="686" x2="686" y1="350" y2="361" /><polyline fill="none" points="681,355 686,361 691,355" stroke="#a7bac1" stroke-width="2" /><rect fill="#fff" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="379" x="494" y="362" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" x="510" y="390">外部服务 / Cloud Computer</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="400" x="510" y="415">用户授权后执行</text></svg>