<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540" version="1.1" viewBox="0 0 920 540" width="920" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>Muse 每用户 VM 内的两个隔离域</title><desc>runtime cell 包含 Hatch 与工具，cell 外是权限凭据存储与代理</desc><defs /><rect fill="#ffffff" height="540" width="920" x="0" y="0" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" x="30" y="35">Muse Secure VM</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="30" y="63">官方公开组件与部署边界 [2]</text><rect fill="#fbfcfd" height="390" rx="16" ry="16" stroke="#7197a5" stroke-width="1.3" width="872" x="24" y="91" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" x="44" y="120">One dedicated Linux VM / user</text><rect fill="#eff5f8" height="307" rx="13" ry="13" stroke="#a7bac1" stroke-width="1.3" width="375" x="43" y="146" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="61" y="175">Runtime cell · systemd-nspawn</text><rect fill="#fff" height="70" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="337" x="61" y="195" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="77" y="223">Hatch · Agent Harness</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="77" y="248">模型决策 / 任务执行 / 子 Agent</text><rect fill="#fff" height="70" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="337" x="61" y="283" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="77" y="311">Workspace / Files / Tools</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="77" y="336">Shell、Skills、工具代码、生成文件</text><rect fill="#fff" height="61" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="337" x="61" y="371" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="77" y="399">受限进程权限</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="77" y="424">User Namespace / Syscall / Caps</text><rect fill="#e8f4f0" height="307" rx="13" ry="13" stroke="#a7bac1" stroke-width="1.3" width="410" x="466" y="146" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="486" y="175">Cell 外服务 · VM 内</text><rect fill="#fff" height="65" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="374" x="483" y="195" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="499" y="223">privsep / hatch-authd</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="499" y="248">连接器受限执行 / 真实凭据保存</text><rect fill="#fff" height="65" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="374" x="483" y="277" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="499" y="305">Sentinel / hatch-safety</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="499" y="330">连接器与出口授权 / 安全检查</text><rect fill="#fff" height="73" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="374" x="483" y="359" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="499" y="387">PostgreSQL / Proxies</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="499" y="412">持久应用状态 / Inference / Telemetry</text><line fill="none" stroke="#167a77" stroke-width="2" x1="419" x2="463" y1="316" y2="316" /><polyline fill="none" points="457,311 463,316 457,321" stroke="#167a77" stroke-width="2" /><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="460" y="503">真实凭据与权限策略由 cell 外服务掌握；大模型推理服务位于 VM 外部</text></svg>