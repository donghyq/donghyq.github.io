<svg baseProfile="full" height="459" version="1.1" viewBox="0 0 920 459" width="920" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><title>外部动作提交与本地记录之间的故障窗口</title><desc>远端已成功但本地未记录时，服务端幂等或对账才能避免重发</desc><defs /><rect fill="#ffffff" height="459" width="920" x="0" y="0" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" x="30" y="35">External Side Effect Recovery</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="30" y="63">SQLite 故障注入：远端已提交，本地尚未记录完成</text><rect fill="#f5f7f8" height="59" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="868" x="26" y="90" /><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" x="50" y="118">Agent 控制存储</text><text fill="#213642" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" x="470" y="118">外部服务</text><line fill="none" stroke="#a7bac1" stroke-width="2" x1="218" x2="218" y1="157" y2="344" /><line fill="none" stroke="#a7bac1" stroke-width="2" x1="675" x2="675" y1="157" y2="344" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" x="45" y="188">SUBMITTED</text><line fill="none" stroke="#167a77" stroke-width="2" x1="220" x2="673" y1="182" y2="182" /><polyline fill="none" points="667,177 673,182 667,187" stroke="#167a77" stroke-width="2" /><text fill="#167a77" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="450" y="174">POST (action_id=A)</text><rect fill="#e8f4f0" height="64" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="318" x="520" y="215" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" x="536" y="243">外部提交成功</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" x="536" y="268">远端记录 action A</text><rect fill="#fff1ef" height="57" rx="12" ry="12" stroke="#a74e4a" stroke-width="1.3" width="330" x="48" y="250" /><text fill="#a74e4a" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" x="67" y="273">本地进程崩溃</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="400" x="67" y="294">未能记录 COMPLETED</text><line fill="none" stroke="#98672a" stroke-dasharray="6,5" stroke-width="2" x1="220" x2="674" y1="322" y2="322" /><polyline fill="none" points="668,317 674,322 668,327" stroke="#98672a" stroke-width="2" /><text fill="#98672a" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" text-anchor="middle" x="450" y="314">重试前查询 / 同键幂等</text><rect fill="#fff6e7" height="64" rx="12" ry="12" stroke="#a7bac1" stroke-width="1.3" width="832" x="44" y="369" /><text fill="#2c4f61" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" x="60" y="397">恢复程序根据外部能力处理</text><text fill="#5a6f78" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="400" x="60" y="422">已有结果 → 补记完成；无幂等且无法确认 → UNKNOWN，暂停自动重发</text></svg>